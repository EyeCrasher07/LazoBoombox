name: Build LazoBoombox

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.loader }} ${{ matrix.version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - loader: fabric
            version: "1.21.1"
          - loader: fabric
            version: "1.21.2"
          - loader: fabric
            version: "1.21.3"
          - loader: fabric
            version: "1.21.4"
          - loader: fabric
            version: "1.21.5"
          - loader: fabric
            version: "1.21.6"
          - loader: fabric
            version: "1.21.7"
          - loader: fabric
            version: "1.21.8"
          - loader: fabric
            version: "1.21.9"
          - loader: fabric
            version: "1.21.10"
          - loader: fabric
            version: "1.21.11"
          - loader: neoforge
            version: "1.21.1"
          - loader: neoforge
            version: "1.21.2"
          - loader: neoforge
            version: "1.21.3"
          - loader: neoforge
            version: "1.21.4"
          - loader: neoforge
            version: "1.21.5"
          - loader: neoforge
            version: "1.21.6"
          - loader: neoforge
            version: "1.21.7"
          - loader: neoforge
            version: "1.21.8"
          - loader: neoforge
            version: "1.21.9"
          - loader: neoforge
            version: "1.21.10"
          - loader: neoforge
            version: "1.21.11"
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Make Gradle executable
        run: chmod +x "${{ matrix.loader }}/${{ matrix.version }}/gradlew"
      - name: Build
        working-directory: ${{ matrix.loader }}/${{ matrix.version }}
        run: ./gradlew build --no-daemon
      - name: Find JAR
        id: jar
        working-directory: ${{ matrix.loader }}/${{ matrix.version }}
        shell: bash
        run: |
          JAR=$(find build/libs -maxdepth 1 -type f -name "*.jar" ! -name "*-sources.jar" | head -n 1)
          if [ -z "$JAR" ]; then
            echo "No JAR found!"
            ls -la build/libs
            exit 1
          fi
          echo "Found: $JAR"
          echo "path=$JAR" >> "$GITHUB_OUTPUT"
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: LazoBoombox-${{ matrix.loader }}-${{ matrix.version }}
          path: ${{ matrix.loader }}/${{ matrix.version }}/${{ steps.jar.outputs.path }}
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Download all JARs
        uses: actions/download-artifact@v5
        with:
          path: release-assets
          pattern: LazoBoombox-*
          merge-multiple: true
      - name: Show release files
        run: |
          echo "Release files:"
          find release-assets -type f -name "*.jar" -print
      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="build-${GITHUB_RUN_NUMBER}"
          fi
          gh release create "$TAG" \
            release-assets/*.jar \
            --title "LazoBoombox $TAG" \
            --generate-notes
