plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'com.gradleup.shadow' version '8.3.7'
}
version = '0.1.0+1.21.10'
group = 'com.eyecrasher'
base { archivesName = 'lazoboombox-neoforge' }
java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}
repositories {
    mavenCentral()
    maven { url = 'https://repo.plasmoverse.com/releases' }
    maven { url = 'https://repo.plo.su/' }
    maven { url = 'https://maven.lavalink.dev/releases' }
    maven { url = 'https://maven.lavalink.dev/snapshots' }
    maven { url = 'https://jitpack.io' }
}
configurations {
    shade
    shadeRuntime
    implementation.extendsFrom(shade)
}
configurations.configureEach { resolutionStrategy.force 'org.apache.httpcomponents:httpclient:4.5.13' }
neoForge {
    version = '21.10.50-beta'
    accessTransformers.from(project.file("src/main/resources/META-INF/accesstransformer.cfg"))
    mods {
        lazoboombox {
            sourceSet(sourceSets.main)
        }
    }
}
dependencies {
    implementation 'net.neoforged:neoforge:21.10.50-beta'
    compileOnly('su.plo.voice.api:server:2.1.10') {
        exclude group: 'com.google.guava', module: 'guava'; exclude group: 'com.google.guava', module: 'failureaccess'; exclude group: 'com.google.guava', module: 'listenablefuture'; exclude group: 'com.google.code.findbugs', module: 'jsr305'; exclude group: 'org.checkerframework', module: 'checker-qual'; exclude group: 'com.google.errorprone', module: 'error_prone_annotations'; exclude group: 'com.google.j2objc', module: 'j2objc-annotations'; exclude group: 'it.unimi.dsi', module: 'fastutil'; exclude group: 'com.google.code.gson', module: 'gson'
    }
    shade('dev.arbjerg:lavaplayer:2.2.6') {
        exclude group: 'org.slf4j', module: 'slf4j-api'; exclude group: 'commons-io', module: 'commons-io'; exclude group: 'commons-codec', module: 'commons-codec'; exclude group: 'net.java.dev.jna', module: 'jna'; exclude group: 'org.jetbrains', module: 'annotations'; exclude group: 'org.jetbrains.kotlin'; exclude group: 'org.jetbrains.kotlinx'
        exclude group: 'com.fasterxml.jackson.core'; exclude group: 'com.fasterxml.jackson'
    }
    shade('dev.lavalink.youtube:v2:f45bbb7aebfcbc1c553769e04af6cd43afa8b7c3-SNAPSHOT') {
        exclude group: 'org.slf4j', module: 'slf4j-api'; exclude group: 'commons-io', module: 'commons-io'; exclude group: 'commons-codec', module: 'commons-codec'; exclude group: 'net.java.dev.jna', module: 'jna'; exclude group: 'org.jetbrains', module: 'annotations'; exclude group: 'org.jetbrains.kotlin'; exclude group: 'org.jetbrains.kotlinx'
    }
    shadeRuntime 'com.fasterxml.jackson.core:jackson-core:2.15.2'
    shadeRuntime 'com.fasterxml.jackson.core:jackson-databind:2.15.2'
    shadeRuntime 'com.fasterxml.jackson.core:jackson-annotations:2.15.2'
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
jar { archiveClassifier.set('dev'); duplicatesStrategy = DuplicatesStrategy.EXCLUDE; exclude 'com/eyecrasher/lazodiscs/**' }
shadowJar {
    archiveClassifier.set(''); configurations = [project.configurations.shade, project.configurations.shadeRuntime]; duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    exclude 'com/sedmelluq/**'; exclude 'dev/lavalink/**'; exclude 'com/fasterxml/jackson/**'; exclude 'com/eyecrasher/lazodiscs/**'; exclude 'natives/**'
    exclude 'org/apache/http/**'; exclude 'org/apache/commons/**'; exclude 'org/json/**'; exclude 'org/mozilla/**'; exclude 'org/jsoup/**'; exclude 'org/slf4j/**'; exclude 'mozilla/**'; exclude 'net/iharder/**'
    exclude 'com/google/gson/**'; exclude 'com/google/common/**'; exclude 'it/unimi/dsi/fastutil/**'; exclude 'com/sun/jna/**'; exclude 'javax/annotation/**'; exclude 'org/jetbrains/annotations/**'; exclude 'org/checkerframework/**'; exclude 'kotlin/**'; exclude 'kotlinx/**'
    exclude 'META-INF/*.SF'; exclude 'META-INF/*.DSA'; exclude 'META-INF/*.RSA'; exclude 'META-INF/MANIFEST.MF'; exclude 'META-INF/maven/**'; exclude 'META-INF/versions/**'; exclude 'META-INF/services/com.fasterxml.jackson.*'; exclude 'module-info.class'
}
build.dependsOn shadowJar
