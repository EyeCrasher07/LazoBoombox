plugins {
    id 'fabric-loom' version '1.13.6'
    id 'java-library'
    id 'com.gradleup.shadow' version '8.3.11'
}

version = '0.1.3+1.21.4'
group = 'com.eyecrasher'

base {
    archivesName = 'lazoboombox-fabric'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

loom {
    accessWidenerPath = file("src/main/resources/lazoboombox.accesswidener")
}

repositories {
    mavenCentral()
    maven {
        url = 'https://repo.plasmoverse.com/releases'
    }
    maven {
        url = 'https://repo.plo.su/'
    }
    maven {
        url = 'https://maven.lavalink.dev/releases'
    }
    maven {
        url = 'https://maven.lavalink.dev/snapshots'
    }
    maven {
        url = 'https://jitpack.io'
    }
}

configurations {
    shade
    shadeRuntime
    implementation.extendsFrom(shade)
}

dependencies {
    minecraft 'com.mojang:minecraft:1.21.4'
    mappings loom.officialMojangMappings()
    modImplementation 'net.fabricmc:fabric-loader:0.19.5'
    modImplementation 'net.fabricmc.fabric-api:fabric-api:0.109.1+1.21.4'
    compileOnly('su.plo.voice.api:server:2.1.10') {
        exclude group: 'com.google.guava', module: 'guava';
        exclude group: 'com.google.guava', module: 'failureaccess';
        exclude group: 'com.google.guava', module: 'listenablefuture';
        exclude group: 'com.google.code.findbugs', module: 'jsr305';
        exclude group: 'org.checkerframework', module: 'checker-qual';
        exclude group: 'com.google.errorprone', module: 'error_prone_annotations';
        exclude group: 'com.google.j2objc', module: 'j2objc-annotations';
        exclude group: 'it.unimi.dsi', module: 'fastutil';
        exclude group: 'com.google.code.gson', module: 'gson'
    }
    // LazoDiscs provides LavaPlayer at runtime; compile-only avoids duplicate packages.
    compileOnly('dev.arbjerg:lavaplayer:2.2.7') {
        exclude group: 'org.slf4j', module: 'slf4j-api'
        exclude group: 'commons-io', module: 'commons-io'
        exclude group: 'commons-codec', module: 'commons-codec'
        exclude group: 'net.java.dev.jna', module: 'jna'
        exclude group: 'org.jetbrains', module: 'annotations'
        exclude group: 'org.jetbrains.kotlin'
        exclude group: 'org.jetbrains.kotlinx'
        exclude group: 'com.fasterxml.jackson.core'
        exclude group: 'com.fasterxml.jackson'
        exclude group: 'org.apache.httpcomponents'
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

processResources {
    inputs.property 'version', project.version;
    filesMatching('fabric.mod.json') {
        expand version: project.version
    }
}

jar {
    archiveClassifier.set('dev');
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE;
    exclude 'com/eyecrasher/lazodiscs/**'
}

shadowJar {
    archiveClassifier.set('dev-shadow');
    configurations = [project.configurations.shade, project.configurations.shadeRuntime];
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    exclude 'com/sedmelluq/**';
    exclude 'dev/lavalink/**';
    exclude 'com/fasterxml/jackson/**';
    exclude 'com/eyecrasher/lazodiscs/**';
    exclude 'natives/**'
    exclude 'org/apache/http/**';
    exclude 'org/apache/commons/**';
    exclude 'org/json/**';
    exclude 'org/mozilla/**';
    exclude 'org/jsoup/**';
    exclude 'org/slf4j/**';
    exclude 'mozilla/**';
    exclude 'net/iharder/**'
    exclude 'com/google/gson/**';
    exclude 'com/google/common/**';
    exclude 'it/unimi/dsi/fastutil/**';
    exclude 'com/sun/jna/**';
    exclude 'javax/annotation/**';
    exclude 'org/jetbrains/annotations/**';
    exclude 'org/checkerframework/**';
    exclude 'kotlin/**';
    exclude 'kotlinx/**'
    exclude 'META-INF/*.SF';
    exclude 'META-INF/*.DSA';
    exclude 'META-INF/*.RSA';
    exclude 'META-INF/MANIFEST.MF';
    exclude 'META-INF/maven/**';
    exclude 'META-INF/versions/**';
    exclude 'META-INF/services/com.fasterxml.jackson.*';
    exclude 'module-info.class'
}

remapJar {
    dependsOn shadowJar;
    inputFile.set(shadowJar.archiveFile);
    archiveClassifier.set('')
}

build.dependsOn remapJar

// Include the project's license in release, development and source archives.
tasks.withType(Jar).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    from(file('../../LICENSE'))
}

// Generate the shared flat sprite for paint-tinted terrain particles.
apply from: '../../gradle/boombox-particle-resources.gradle'
